name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-checks:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=
  checks-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_RECALL_API_URL: ${{ vars.NEXT_PUBLIC_RECALL_API_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run local regression checks without services
        run: pnpm test
      - name: Run local integration checks without services
        run: pnpm test:local-integration
      - run: pnpm policy:static
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Build deterministic screen catalog
        run: pnpm build-storybook
      - name: Install Chromium for Storybook screenshots
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Capture every Storybook story
        id: capture-storybook
        continue-on-error: true
        run: pnpm screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-storybook-screenshots
          path: artifacts/storybook-screenshots
          if-no-files-found: error
          retention-days: 14
      - name: Report Storybook screenshot failures
        if: steps.capture-storybook.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: recall-storybook
          path: apps/web/storybook-static
          if-no-files-found: error
          retention-days: 14
      - name: Build web application with offline support
        run: pnpm build
      - name: Package web application with browser assets
        working-directory: apps/web
        run: |
          if [ -f .next/standalone/apps/web/server.js ]; then
            server_directory=.next/standalone/apps/web
          elif [ -f .next/standalone/server.js ]; then
            server_directory=.next/standalone
          else
            echo "Standalone Next.js server entrypoint is missing" >&2
            exit 1
          fi
          mkdir -p "$server_directory/.next"
          cp -R .next/static "$server_directory/.next/static"
          if [ -d public ]; then cp -R public "$server_directory/public"; fi
          tar -czf recall-next-server.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: recall-web
          path: apps/web/recall-next-server.tar.gz
          if-no-files-found: error
          retention-days: 14
