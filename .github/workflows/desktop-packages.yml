name: Desktop packages (unsigned development)

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  package:
    name: Unsigned ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            script: dist:linux
            artifact: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/checksums.json
          - name: macos-x64
            runner: macos-14
            script: dist:mac
            artifact: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/checksums.json
          - name: macos-arm64
            runner: macos-14
            script: dist:mac:arm64
            artifact: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/checksums.json
          - name: windows-x64
            runner: windows-2022
            script: dist:windows
            artifact: |
              apps/desktop/release/*.exe
              apps/desktop/release/checksums.json
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop ${{ matrix.script }}
      - run: node scripts/write-desktop-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: recall-unsigned-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
