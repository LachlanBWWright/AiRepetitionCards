name: Desktop packages (unsigned development)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      chatgpt_direct:
        description: Enable direct ChatGPT authorization for an eligible local desktop distribution
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-unsigned-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Unsigned ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            script: dist:linux
            platform: linux
            arch: x64
            artifact: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/checksums.json
          - name: macos-x64
            runner: macos-26-intel
            script: dist:mac
            platform: mac
            arch: x64
            artifact: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/checksums.json
          - name: macos-arm64
            runner: macos-26
            script: dist:mac:arm64
            platform: mac
            arch: arm64
            artifact: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/checksums.json
          - name: windows-x64
            runner: windows-2022
            script: dist:windows
            platform: windows
            arch: x64
            artifact: |
              apps/desktop/release/*.exe
              apps/desktop/release/checksums.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_RECALL_API_URL: ${{ vars.NEXT_PUBLIC_RECALL_API_URL }}
      RECALL_API_URL: ${{ vars.RECALL_API_URL || vars.NEXT_PUBLIC_RECALL_API_URL }}
      RECALL_CHATGPT_LOCAL_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.chatgpt_direct && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop ${{ matrix.script }}
      - name: Verify installers and record checksums
        run: node scripts/write-desktop-checksums.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: recall-unsigned-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
