plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.recallocr'
version = '0.1.0'
android {
  namespace 'expo.modules.recallocr'

  defaultConfig {
    versionCode 1
    // Expo's publication configuration reads the Android version separately.
    versionName project.version.toString()
  }
}
dependencies {
  // Bundled model: no first-use network/model download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.4.1'
}
